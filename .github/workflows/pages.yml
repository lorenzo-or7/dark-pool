# Publishes the public landing page (no login, no lab, no backend) to GitHub Pages.
# Repository setting required once: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and unit tests
        run: |
          npx tsc -b
          npm test

      - name: Build the public site
        env:
          DP_BASE: /dark-pool/
          VITE_PUBLIC_ONLY: 'true'
        run: |
          npx vite build
          # Unknown paths under /dark-pool/ load the app, which shows its own 404 page.
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
